<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <link rel="stylesheet" href="panier.css">
</head>
<body>
    <div class="login-card">
        <h1>Se connecter</h1>
        <p class="subtitle">Entrez vos identifiants pour accéder à votre compte</p>

        <form>
            <div class="input-group">
                <input type="email" placeholder="Adresse e-mail" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Mot de passe" required>
                
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Se souvenir de moi</span>
                </label>
                <a href="pass.html" class="forgot-password">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
            <a href="https://www.google.com/search?q=bonjour&rlz=1C1CFYW_frTN1186TN1186&oq=bonjour&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIKCAIQABiABBi0BzIKCAMQABiABBi0BzIHCAQQABiABDINCAUQLhivARjHARiABDIHCAYQABiABDIKCAcQABiABBi0BzIHCAgQABiABDINCAkQLhivARjHARiABNIBCDQ2MjBqMGo3qAIAsAIA&sourceid=chrome&source=chrome.ob&ie=UTF-8"
            >se connecter</a>
        </form>

        <p class="footer-text">
            Vous n'avez pas de compte ? 
            <a href="sign.html" class="create-account">Créer un compte</a>
        </p>
    </div>

</body>
</html>
