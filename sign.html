<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>

    <!-- Cadre principal identique au login -->
    <div class="login-card">
        <h1>Créer un compte</h1>
        <p class="subtitle">Remplissez les informations ci-dessous pour vous inscrire</p>

        <form>
            <div class="input-group">
                <input type="text" placeholder="Prénom" required>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Nom" required>
            </div>

            <div class="input-group">
                <input type="date" required>
            </div>

            <div class="input-group">
                <input type="tel" placeholder="Numéro de téléphone" required>
            </div>

            <div class="input-group">
                <input type="email" placeholder="Adresse e-mail" required>
            </div>

            <div class="input-group">
                <select required>
                    <option value="">Choisir votre pays</option>
                    <option>Tunisie</option>
                    <option>France</option>
                    <option>Algérie</option>
                    <option>Maroc</option>
                    <option>Autre</option>
                </select>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Créer un mot de passe" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Confirmer le mot de passe" required>
            </div>

            <button type="submit" class="btn-submit">S'inscrire</button><a href="https://www.google.com/search?q=bonjour&rlz=1C1CFYW_frTN1186TN1186&oq=bonjour&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIKCAIQABiABBi0BzIKCAMQABiABBi0BzIHCAQQABiABDINCAUQLhivARjHARiABDIHCAYQABiABDIKCAcQABiABBi0BzIHCAgQABiABDINCAkQLhivARjHARiABNIBCDQ2MjBqMGo3qAIAsAIA&sourceid=chrome&source=chrome.ob&ie=UTF-8"></a>
        </form>

        <p class="footer-text">
            Vous avez déjà un compte ? 
            <a href="panier.html" class="create-account">Se connecter</a>
        </p>
    </div>

</body>
</html>
